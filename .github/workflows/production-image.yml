name: Typebattle VPS deployment
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect, deploy or enable HTTPS for the standalone Typebattle application
        type: choice
        options: [inspect, deploy, https]
        default: inspect
permissions:
  contents: read
concurrency:
  group: typebattle-vps-${{ inputs.mode == 'inspect' && 'inspect' || 'write' }}
  cancel-in-progress: false
jobs:
  typebattle:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile standalone Typebattle on the Hack the Andes VPS
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          TYPEBATTLE_ADMIN_KEY: ${{ secrets.TYPEBATTLE_ADMIN_KEY }}
          DEPLOY_MODE: ${{ inputs.mode }}
        run: node deployment/typebattle/deploy.mjs
